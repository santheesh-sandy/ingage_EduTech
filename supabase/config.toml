# Supabase CLI settings for this project. Deploy with: npm run deploy:fn
[functions.chat]
# Visitors call this with the publishable key, so the gateway JWT check is off. The function itself
# checks signed-in learners' tokens (Supabase Auth), allows only ALLOWED_ORIGINS, and applies a shared
# per-user / per-IP rate limit (Postgres function public.chat_hit).
verify_jwt = false
